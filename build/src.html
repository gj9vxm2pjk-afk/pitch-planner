<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pitch Planner</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap">
<style>
:root{
  /* Whitley Bay Rockcliff RFC: cardinal red, club gold, cream */
  --bg:#f8f5ee; --surface:#ffffff; --text:#1c1618; --muted:#6d6063; --line:#e6dfd2; --soft:#f1ece1;
  --brand:#b81d36; --brand-ink:#ffffff; --gold:#f2b705;
  --accent:#b81d36; --accent-ink:#ffffff; --danger:#b3202c; --warn-bg:#fff4d6; --warn-ink:#6b4b00;
  --tint:52% 84%;                       /* saturation and lightness of the group colours */
  --hour:56px;
  --r:10px; --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px;
  --display:'Oswald','Arial Narrow','Helvetica Neue',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17100f; --surface:#241a1a; --text:#f4ece3; --muted:#b8a9a6; --line:#3a2c2c; --soft:#2d2222;
    --brand:#8e1428; --accent:#d63a52; --danger:#ff8a93; --warn-bg:#3a2f12; --warn-ink:#f7d98a; --tint:40% 66%;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#17100f; --surface:#241a1a; --text:#f4ece3; --muted:#b8a9a6; --line:#3a2c2c; --soft:#2d2222;
  --brand:#8e1428; --accent:#d63a52; --danger:#ff8a93; --warn-bg:#3a2f12; --warn-ink:#f7d98a; --tint:40% 66%;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,select,input{font:inherit;color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:0 var(--s4)}
/* header: one slim line */
header.brand{display:flex;align-items:center;gap:var(--s3);min-height:52px;padding:6px var(--s4);background:var(--brand);color:var(--brand-ink);border-bottom:3px solid var(--gold)}
header.brand .crest{height:34px;width:auto;flex:none;background:#fff;border-radius:50%;padding:2px}
header.brand h1{margin:0;font-size:1.02rem;font-weight:600;letter-spacing:.01em;line-height:1.2}
header.brand .club{font:inherit;font-weight:400;opacity:.85;margin-right:6px;text-transform:none;letter-spacing:0;color:inherit}
@media (max-width:520px){header.brand .club{display:none}header.brand .status{display:none}header.brand .reqlink{font-size:.78rem;padding:4px 10px}}
header.brand .reqlink{margin-left:auto;color:var(--brand-ink);font-size:.82rem;font-weight:600;text-decoration:none;border:1px solid rgba(255,255,255,.5);border-radius:999px;padding:5px 12px;white-space:nowrap}
header.brand .reqlink:hover{background:rgba(255,255,255,.15)}
header.brand .reqlink+.status{margin-left:var(--s3)}
body.tv .reqlink{display:none}
header.brand .status{margin-left:auto;white-space:nowrap;color:var(--brand-ink);opacity:.85;font-size:.78rem}
.banner{margin:var(--s2) var(--s4);padding:var(--s2) var(--s3);border-radius:var(--r);font-size:.88rem;background:color-mix(in srgb,var(--danger) 12%,var(--surface));border:1px solid var(--danger)}
.banner.info{background:var(--warn-bg);border-color:transparent;color:var(--warn-ink)}
.banner.inmain{margin:var(--s2) 0}
/* controls: one row, then the days */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s3) var(--s4);max-width:1040px;margin:0 auto;padding:var(--s4) var(--s4) var(--s2)}
.tabs{display:inline-flex;background:var(--soft);border-radius:999px;padding:3px}
.tabs button{border:0;background:none;padding:7px 18px;border-radius:999px;font-weight:600;color:var(--muted);cursor:pointer;min-height:36px}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.nav{display:inline-flex;align-items:center;gap:var(--s2);font-weight:600}
.roundbtn{border:1px solid var(--line);background:var(--surface);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:1rem;line-height:1}
.wk{min-width:11ch;text-align:center}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;cursor:pointer;padding:6px 4px}
.linkbtn[hidden]{display:none}
.search{margin-left:auto}
input[type=search]{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;min-height:36px;width:200px;max-width:100%}
.days{display:flex;flex-wrap:wrap;gap:var(--s2);max-width:1040px;margin:0 auto;padding:0 var(--s4) var(--s3)}
.days button{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px 16px;min-height:44px;cursor:pointer;text-align:left;line-height:1.2}
.days button small{display:block;color:var(--muted);font-size:.76rem}
.days button[aria-pressed="true"]{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
main{max-width:1040px;margin:0 auto;padding:0 var(--s4) 32px}
/* needs attention */
.attn{border-radius:var(--r);background:var(--warn-bg);color:var(--warn-ink);margin:var(--s2) 0 var(--s4);overflow:hidden}
.attn>button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:var(--s2);width:100%;padding:11px var(--s4);cursor:pointer;font-weight:600}
.attn>button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.attn .chev{margin-left:auto;transition:transform .15s}
.attn[data-open="true"] .chev{transform:rotate(90deg)}
.attn ul{margin:0;padding:0 var(--s4) var(--s3) 38px;display:none}
.attn[data-open="true"] ul{display:block}
.attn li{padding:3px 0}
.okline{margin:var(--s2) 0 var(--s4);color:var(--muted);font-size:.9rem}
/* sections */
h2.dayhead{font-size:1.1rem;margin:var(--s5) 0 var(--s2);font-weight:700;display:flex;flex-wrap:wrap;align-items:baseline;gap:var(--s1) var(--s3)}
h2.dayhead small{font-weight:400;color:var(--muted);font-size:.84rem}
h2.dayhead .quiet{margin-left:auto}
h2.sec{font-size:1.02rem;margin:var(--s5) 0 var(--s2);font-weight:700}
.quiet{border:0;background:none;color:var(--muted);font-size:.84rem;font-weight:500;cursor:pointer;padding:6px 4px;border-radius:6px}
.quiet[aria-pressed="true"]{color:var(--danger);font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:var(--s3)}
.plan{container-type:inline-size}
.sub{color:var(--muted);font-size:.84rem}
.strip{margin:0 0 var(--s2);font-size:.86rem;color:var(--muted)}
.strip b{color:var(--text)}
/* pitch grid */
.gridwrap{overflow:auto;max-height:78vh;padding-top:14px}
.grid{display:grid;position:relative;column-gap:var(--s3)}
.corner,.colhead{position:sticky;top:0;z-index:4;background:var(--surface);padding:0 0 var(--s2);font-weight:600;font-size:.86rem;color:var(--muted)}
.colhead.over{color:var(--danger)}
.times{position:relative}
.times div{height:var(--hour);font-size:.74rem;color:var(--muted);transform:translateY(-.55em)}
.col{position:relative;border-top:1px solid var(--line);background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% var(--hour);border-radius:6px}
.blk{position:absolute;border-radius:7px;padding:6px 8px;overflow:hidden;color:#16190f;font-size:.82rem;line-height:1.25;border:1px solid rgba(0,0,0,.06)}
.blk b{display:block;font-size:.86rem;overflow-wrap:anywhere}
.blk .sub{color:inherit;opacity:.78;font-size:.8rem;overflow-wrap:anywhere}
.blk.over{outline:2px solid var(--danger);outline-offset:-2px}
.blk.free{background-color:transparent;background-image:repeating-linear-gradient(135deg,transparent 0 7px,color-mix(in srgb,var(--muted) 16%,transparent) 7px 8px);border:1px solid var(--line);color:var(--muted)}
.blk.free b{font-weight:600}
.tag{display:inline-block;font-weight:700;font-size:.68rem;border-radius:4px;padding:0 5px;margin-bottom:2px;background:var(--danger);color:#fff}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .tag{color:#2a0a0d} }
:root[data-theme="dark"] .tag{color:#2a0a0d}
.cp{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:rgba(0,0,0,.18);font-size:.62rem;font-weight:700;margin-left:5px;vertical-align:1px}
.key{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s4);font-size:.8rem;color:var(--muted);padding:var(--s3) 0 0}
.key i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* changing rooms */
.rooms{width:100%;border-collapse:collapse;font-size:.88rem}
.rooms th{font-weight:600;color:var(--muted);text-align:left;padding:0 var(--s2) var(--s2);font-size:.8rem}
.rooms td{padding:7px var(--s2);border-top:1px solid var(--line);vertical-align:top}
.rooms td.t{color:var(--muted);white-space:nowrap;width:6rem}
.chipx{display:inline-block;border-radius:6px;padding:2px 8px;color:#16190f;font-size:.84rem}
.chipx.v{opacity:.66;font-style:italic}
.none{color:var(--danger);font-weight:600}
.empty{color:var(--muted)}
/* paddock and away lists */
.pad{display:flex;flex-wrap:wrap;gap:var(--s1) var(--s3);padding:7px 0;border-top:1px solid var(--line);font-size:.9rem}
.pad:first-child{border-top:0}
.pad .t{color:var(--muted);width:7.4rem;flex:none}
.pad .clash{color:var(--danger);font-weight:700}
/* phone list (replaces the grid in a narrow container) */
.plist{display:none}
.slot{padding:var(--s3) 0;border-top:1px solid var(--line)}
.slot:first-child{border-top:0;padding-top:0}
.slot h3{margin:0 0 var(--s2);font-size:.86rem;color:var(--muted);font-weight:600}
.li{display:flex;gap:var(--s2);align-items:center;padding:6px 0;font-size:.92rem}
.li .dot{width:10px;height:10px;border-radius:50%;flex:none}
.li .where{margin-left:auto;font-size:.78rem;color:var(--muted);white-space:nowrap}
.li.f{color:var(--muted)}
.li .bt{color:var(--danger);font-weight:700;font-size:.78rem}
@container (max-width:640px){
  .gridwrap{display:none}
  .plist{display:block}
  .key{display:none}
  .rooms thead{display:none}
  .rooms, .rooms tbody{display:block}
  .rooms tr{display:block;padding:8px 0;border-top:1px solid var(--line)}
  .rooms tr:first-child{border-top:0;padding-top:0}
  .rooms td{display:block;border:0;padding:2px 0}
  .rooms td.t{width:auto;font-weight:600;color:var(--text);padding-bottom:4px}
  .rooms td[data-room]{display:flex;gap:8px;align-items:center}
  .rooms td[data-room]::before{content:attr(data-room);color:var(--muted);font-size:.78rem;width:3.4rem;flex:none}
  .rooms td[data-room]:has(.empty){display:none}
}
/* message screen */
.mintro{display:flex;flex-wrap:wrap;gap:var(--s3);align-items:center;justify-content:space-between;margin:var(--s3) 0}
.mintro p{margin:0;font-size:.88rem;color:var(--muted);flex:1 1 18rem}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;cursor:pointer;min-height:40px;font-weight:600}
.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.msgbox{display:block;width:100%;min-height:55vh;resize:vertical;margin:0;padding:var(--s3);border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--text);font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.bad-text{color:var(--danger)}
body.tv{font-size:20px;--hour:84px}
body.tv header.brand .crest{height:46px}
body.tv .bar, body.tv .days{display:none}
@media (max-width:700px){ .wk{min-width:9ch} .search{margin-left:0;width:100%} input[type=search]{width:100%} }
</style>
</head>
<body>
<header class="brand">
  <img class="crest" src="__CREST__" alt="Whitley Bay Rockcliff RFC crest">
  <h1><span class="club">Whitley Bay Rockcliff RFC</span>Pitch Planner</h1>
  <a class="reqlink" id="reqlink" target="_blank" rel="noopener" hidden>Request a change</a>
  <span class="status" id="status" role="status"></span>
</header>
<div id="banners"></div>
<div class="bar" id="bar">
  <div class="tabs" id="viewSeg" role="group" aria-label="Screen">
    <button data-v="day">Plan</button><button data-v="message">Message</button>
  </div>
  <div class="nav">
    <button class="roundbtn" id="prev" aria-label="Previous week">&larr;</button>
    <span class="wk" id="wk"></span>
    <button class="roundbtn" id="next" aria-label="Next week">&rarr;</button>
    <button class="linkbtn" id="today" hidden>This week</button>
  </div>
  <div class="search"><input type="search" id="q" placeholder="Find a team" aria-label="Find a team"></div>
</div>
<div class="days" id="daySeg" role="group" aria-label="Day"></div>
<main id="main"></main>

<script>
/* ============================ CONFIG ============================
 * To connect the club sheet ("WBR Age Grade Fixtures 26/27"):
 *  1. Google Sheets: File > Share > Publish to web. Pick the "Combined Fixture list" tab,
 *     choose "Comma-separated values (.csv)", Publish. Copy the link into FIXTURES_CSV_URL.
 *     Repeat for the "Config and info" tab (optional) into CONFIG_CSV_URL.
 *     (Anyone with a published link can read that tab.)
 *  2. Leave FIXTURES_CSV_URL as '' to show the built-in snapshot.
 *
 * Sheet layout this page understands: row 1 = group, row 2 = team, column A = date (DD/MM).
 * Each team has: [opponent/activity] [HG home grass | HA home AGP | AW away] [CP car-park duty].
 */
const CONFIG = {
  FIXTURES_CSV_URL: '',
  CONFIG_CSV_URL: '',
  REFRESH_MINUTES: 5,
  TV_CYCLE_SECONDS: 15,
  SEASON_START: '2026-08-02',               // used to give DD/MM dates a year (overridden by the Config tab)
  // Each surface is one full pitch shown as two halves (Grass 1 + Grass 2, AGP 1 + AGP 2).
  // A full-pitch team takes both halves; smaller teams share them.
  CAPACITY: { grass: 1, agp: 1 },            // full pitches per surface
  // Changing rooms: in each time slot the home teams are ranked by seniority (age group). The most senior
  // teams get rooms 1 and 3, the least senior get rooms 2 and 4. Teams arrive ready to play and change after
  // the match; a room is booked from match end for ROOM_CHANGE_MIN, then needs ROOM_TURNAROUND_MIN.
  ROOMS: { senior: [1, 3], junior: [2, 4] },
  // Bookable extras (booked in the separate "WBR Paddock & Scrum Machine Bookings" sheet: Date, Start, End, Resource, Team, Notes)
  RESOURCES: ['Paddock', 'Junior Scrum Machine', 'Adult Scrum Machine'],
  // Weekly training (the "WBR Training Schedule" sheet: Day, Team, Start, End, Resource, Share, Weeks). Weeks = All, A or B.
  // Week A is the week starting on this Monday; the weeks then alternate A, B, A, B...
  WEEK_A_START: '2026-10-05',
  TRAINING_CSV_URL: '',
  BOOKINGS_CSV_URL: '',
  SENIORS_CSV_URL: '',
  REQUEST_FORM_URL: 'https://docs.google.com/forms/d/e/1FAIpQLSceNwcRr2E8jN2cSxZuPcuwLcgjZMypCZYPqkDyLyANCvviQg/viewform',   // "Request a change" link ('' hides it)
  MESSAGE_SIGNOFF: '[Coordinator name]',   // used in the weekend message
  ROOM_CHANGE_MIN: 30,
  ROOM_TURNAROUND_MIN: 30,
  ROOM_GROUPS: ['JUNIOR BOYS', 'JUNIOR GIRLS', 'WOMEN', 'MEN'],   // minis don't book rooms
  ROOM_KINDS: ['match'],                                    // add 'session' to book rooms for training too
  OVERRUN: 0.34,                             // allowance before flagging; 0.34 lets 1/3 + 1/2 + 1/2 fit, as the Pitch Usage tab plans
  SHOW_FREE_SPACE: true,                    // draw dashed 'free' blocks on the Pitches grid where a weekend slot has room
  FREE_MIN: 0.3,                             // smallest free share worth showing (0.3 = about a third of a pitch)
  SLOTS: [
    { id: 'a', s: 9*60,      e: 10*60+30 },
    { id: 'b', s: 10*60+30,  e: 12*60+30 },
    { id: 'c', s: 12*60+30,  e: 15*60 }
  ],
  // Slot by sheet group: MINIS in the first slot, JUNIOR BOYS second, everything else third.
  SLOT_BY_GROUP: { 'MINIS': 'a', 'JUNIOR BOYS': 'b' },
  SLOT_BY_TEAM: { 'Colts': 'c' },            // per-team overrides win over group
  // Minimum pitch share per team (from the sheet's "Config and info" tab; used if that tab isn't linked).
  PITCH_SHARE: { 'U6': 1/3, 'U7': 1/3, 'U8': 1/3, 'U9': 1/3, 'U10': 1/3, 'U11': 1/3, 'U12 Boys': 1/3, 'U12 Girls': 1/2,
                 'U13 Boys': 1, 'U13 Girls': 1, 'U14 Boys': 1, 'U15 Boys': 1, 'U16 Boys': 1, 'U16 Girls': 1, 'Colts': 1 },
  DEFAULT_SHARE: 1,
  // A fixture with a kick-off time (the senior men's teams) holds its pitch from KO_WINDOW.before minutes before kick-off to
  // KO_WINDOW.after minutes after it; the changing room then starts when that window ends.
  KO_WINDOW: { before: 60, after: 110 },
  // Groups that never do car park duty: any car park flag in the sheet for these teams is ignored and no car park line is shown.
  NO_CAR_PARK: ['WOMEN', 'MEN'],
  // Who picks a changing room first (higher first). Everything not listed ranks by age group, as before.
  SENIORITY: { "Men's 1st XV": 1000, '1st XV': 999, 'Vikings': 300, 'Rangers': 299, 'Vets': 298 },
  // Mini sizes for the listed teams (these override the sizes above and the Config tab): a third of a pitch for training and
  // pre-season, half for a home match, the whole pitch for a home festival.
  MINIS: { teams: ['U7','U8','U9','U10','U11','U12 Boys'], session: 1/3, match: 1/2, festival: 1 },
  // U6 always use the paddock in this slot on this day and nobody else may book it then; they never use a pitch on that day.
  PADDOCK_RESERVED: [ { team: 'U6', day: 'sun', slot: 'a' } ]
};
const SAMPLE_CSV = /*SAMPLE_CSV*/"";
const TRAINING_CSV = /*TRAINING_CSV*/"";       // copy of the training schedule sheet (set by refresh.py)
const SENIORS_CSV = /*SENIORS_CSV*/"";         // copy of the Seniors tab (senior men's fixtures with kick-off times; set by refresh.py)
const BOOKINGS_CSV = /*BOOKINGS_CSV*/"";      // copy of the paddock & scrum machine bookings sheet (set by refresh.py)
const SNAPSHOT_DATE = /*SNAPSHOT_DATE*/"";   // when the embedded sheet copy was taken (set by refresh.py)

/* ============================ UTIL ============================ */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fmtT = m => `${pad(Math.floor(m/60))}:${pad(m%60)}`;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DAYS = ['mon','tue','wed','thu','fri','sat','sun'], WEEKEND_DAYS = ['fri','sat','sun'];
const DAY_NAME = {mon:'Monday',tue:'Tuesday',wed:'Wednesday',thu:'Thursday',fri:'Friday',sat:'Saturday',sun:'Sunday'};
const DAY_OFF = {mon:-5,tue:-4,wed:-3,thu:-2,fri:-1,sat:0,sun:1};            // days from the week's Saturday
const SURF = { grass:'Grass', agp:'AGP' };
function addDays(d, n){ const x = new Date(d); x.setDate(x.getDate()+n); return x; }
function upcomingSaturday(){
  const t = new Date(); t.setHours(0,0,0,0); const dow = t.getDay();
  return dow === 6 ? t : dow === 0 ? addDays(t,-1) : addDays(t, 6-dow);
}
function parseCSV(text){
  const rows=[]; let row=[], f='', q=false;
  for (let i=0;i<text.length;i++){
    const c=text[i];
    if (q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if (c==='"') q=true;
    else if (c===','){ row.push(f); f=''; }
    else if (c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(f); f=''; rows.push(row); row=[]; }
    else f+=c;
  }
  if (f!==''||row.length){ row.push(f); rows.push(row); }
  return rows;
}
function dayKeyFor(date, sat){
  const diff = Math.round((date - sat)/86400000);
  return ({'-5':'mon','-4':'tue','-3':'wed','-2':'thu','-1':'fri','0':'sat','1':'sun'})[diff] || null;
}
function fracLabel(f){ return f>=0.99 ? 'Full pitch' : Math.abs(f-1/2)<.01 ? '1/2 pitch' : Math.abs(f-1/3)<.01 ? '1/3 pitch' : Math.round(f*100)+'%'; }
function groupKey(g){ const u=String(g||'').toUpperCase(); return u.includes('MINI')?'MINIS':u.includes('BOYS')?'JUNIOR BOYS':u.includes('GIRLS')?'JUNIOR GIRLS':u.includes('WOMEN')?'WOMEN':(/\bMEN|SENIOR/.test(u)?'MEN':'WOMEN'); }
const GROUP_LABEL = {MINIS:'Minis','JUNIOR BOYS':'Junior boys','JUNIOR GIRLS':'Junior girls',WOMEN:'Women',MEN:'Senior men'};
const GROUP_HUE = {MINIS:92,'JUNIOR BOYS':205,'JUNIOR GIRLS':330,WOMEN:38,MEN:262,RES:48};
const colourFor = g => `hsl(${GROUP_HUE[g]??150} var(--tint))`;
function cleanTeam(t){ return t.replace(/\s+/g,' ').trim().replace(/^(U\d+)s$/i,'$1'); }

/* ============================ SHEET PARSING ============================ */
const SESSION_RE = /^\??\s*(pre-?season|training|indoors|joint training)/i;
function parseGrid(rows){
  const isDate = v => /^\s*\d{1,2}\/\d{1,2}\s*$/.test(v||'');
  const first = rows.findIndex(r => isDate(r[0]));
  if (first < 2) throw new Error('could not find the team headers or dates');
  const gRow = rows[first-2], tRow = rows[first-1];
  const width = Math.max(...rows.map(r=>r.length));
  const blocks=[]; let group='', lastT='';

/* Tidy table format: one row per fixture or session. Columns (any order, header names are case-insensitive):

const TABLE_VENUE = {'home grass':'HG','home agp':'HA','away':'AW','hg':'HG','ha':'HA','aw':'AW'};

function parseShare(v){

  if (/^half/.test(t)) return 0.5;

function canonResource(raw){

function parseBookings(rows){

function parseSheetDate(v){

/* ============================ MODEL ============================ */
// How senior a team is: bigger = more senior (Women's 1st XV, 2nd XV, then by age group; Colts count as 17)
function seniority(team){
  if (CONFIG.SENIORITY[team] != null) return CONFIG.SENIORITY[team];
  if (/1st XV/i.test(team)) return 200;
  if (/2nd XV/i.test(team)) return 199;
  if (/colts/i.test(team)) return 17;
  const m = team.match(/U\s?(\d+)/i);
  return m ? +m[1] : 0;
}
function buildRooms(items){
  // Each home match books a pair of rooms: the home team takes room 1 or 3 and the visitors the partner room (2 or 4).
  // When rooms 1 and 3 are both busy the home team can take 2 or 4, and its visitors the matching 1 or 3 if that is free.
  const C = CONFIG, reqs = [], clashes = [], gaps = [];
  const pairs = C.ROOMS.senior.map((r,k)=>[r, C.ROOMS.junior[k]]);                // [[1,2],[3,4]]
  const partner = {}; pairs.forEach(([a,b])=>{ partner[a]=b; partner[b]=a; });
  const order = [...C.ROOMS.senior, ...C.ROOMS.junior];
  const need = items.filter(i=>i.surface && C.ROOM_GROUPS.includes(i.group) && C.ROOM_KINDS.includes(i.kind));
  for (const day of DAYS){
    const list = need.filter(i=>i.day===day).sort((a,b)=>slotById(a.slot).e-slotById(b.slot).e || seniority(b.team)-seniority(a.team) || a.team.localeCompare(b.team));
    const busy = {};                                         // room number -> time it is free again
    for (const i of list){
      const start = slotById(i.slot).e, end = start + C.ROOM_CHANGE_MIN, block = end + C.ROOM_TURNAROUND_MIN;
      const free = r => (busy[r] ?? -1) <= start;
      let home = null, away = null;
      for (const [a,b] of pairs) if (home==null && free(a) && free(b)) { home = a; away = b; }       // a whole pair is free
      if (home==null) for (const [a] of pairs) if (home==null && free(a)) home = a;                    // room 1 or 3 free, partner busy
      if (home==null) for (const [,b] of pairs) if (home==null && free(b)) { home = b; away = free(partner[b]) ? partner[b] : null; }   // fall back to 2 or 4
      const req = {item:i, day, start, end, block, room: home, label:i.team};
      if (home != null){
        busy[home] = block;
        if (i.kind==='match'){
          if (away != null){ busy[away] = block; reqs.push({item:i, day, start, end, block, room: away, label: (i.act||'Visitors').replace(/\s+/g,' ').trim(), visitor:true, home:i.team}); }
          else gaps.push(i);
        }
      } else { req.freeAt = Math.min(...order.map(r=>busy[r] ?? 0)); i.roomClash = true; clashes.push(req); }
      i.room = home; i.roomAway = (home!=null && i.kind==='match') ? away : undefined;
      reqs.push(req);
    }
  }
  return {reqs, clashes, gaps};
}
function modelFor(sat){
  const items = [], paddockRes = [];
  for (const it of DATA.items){
    const day = dayKeyFor(it.date, sat); if (!day) continue;
    const rule = paddockRule(it, day) ? CONFIG.PADDOCK_RESERVED.find(r => r.team===it.team && r.day===day) : null;
    const noCp = CONFIG.NO_CAR_PARK.includes(it.group);
    items.push({...it, day, slot: slotIdFor(it), frac: fracFor(it), cp: it.cp && !noCp, noCp, ...(rule ? {surface:'', paddock:true} : {})});
    if (rule && !paddockRes.some(b=>b.team===it.team && b.day===day)){
      const sl = slotById(rule.slot);
      paddockRes.push({date: it.date, start: sl.s, end: sl.e, resource: 'Paddock', rawRes: 'Paddock', team: it.team, notes: 'Reserved: nobody else can book the paddock then', bad: false, day, reserved: true});
    }
  }
  // allocate home teams within each surface + slot: full pitch = both halves, smaller teams share the halves
  const groups = {};
  items.filter(i=>i.surface).forEach(i => (groups[i.day+'|'+i.surface+'|'+i.slot] ||= []).push(i));
  const shared = [], slotInfo = {};
  for (const k in groups){
    const list = groups[k].slice();
    const surface = list[0].surface, limit = CONFIG.CAPACITY[surface] + CONFIG.OVERRUN + 1e-6, multi = list.length > 1;
    // a full-size team alone takes the whole pitch; with anyone else it takes one half
    list.forEach(i => { i.eff = (i.frac >= 0.99 && multi) ? 0.5 : i.frac; });
    list.sort((a,b)=>b.eff-a.eff);
    const load = [0,0], total = list.reduce((t,o)=>t+o.eff,0), tooMany = total > limit;
    list.forEach(i=>{
      i.groupTotal = total; i.over = tooMany;
      if (i.eff >= 0.99){ i.cols = [0,1]; load[0]+=1; load[1]+=1; }
      else { const c = load[0] <= load[1] ? 0 : 1; i.cols = [c]; load[c] += i.eff; }
      i.sharedWith = list.filter(o=>o!==i);
    });
    slotInfo[k] = {total, free: tooMany ? 0 : Math.max(0, CONFIG.CAPACITY[surface] - total), freeHalf: load[0] <= load[1] ? 0 : 1};
    if (multi) shared.push({day:list[0].day, surface, slot:list[0].slot, items:list, total, over:tooMany});
  }
  // free space per weekend slot: whole pitch when nothing is there, otherwise what is left after the teams placed above
  const slots = [];

    const inf = slotInfo[day+'|'+surface+'|'+sl.id] || {total:0, free:CONFIG.CAPACITY[surface], freeHalf:0};

  const pitchOverlaps = [];

  onPitch.forEach((a,x)=>onPitch.slice(x+1).forEach(b=>{
    if (a.day!==b.day || a.surface!==b.surface || a.slot===b.slot) return;
    const sa = slotById(a.slot), sb = slotById(b.slot);
    if (sa.s < sb.e && sb.s < sa.e) pitchOverlaps.push({a, b});
  }));
  const rooms = buildRooms(items);
  // paddock & scrum machine bookings for this weekend, with overlap checks per resource
  const res = [];
  for (const b of (DATA.bookings||[])){
    if (!b.date) continue;
    const day = dayKeyFor(b.date, sat); if (!day) continue;
    res.push({...b, day});
  }
  res.push(...paddockRes);
  // weekly training: pitch sessions are placed on the halves of each surface; paddock sessions join the paddock bookings
  const wk = weekLetter(sat), train = [], badTrain = [];
  for (const t of (DATA.training||[])){
    if (t.bad){ badTrain.push(t); continue; }
    if (t.weeks!=='ALL' && t.weeks!==wk) continue;
    const date = addDays(sat, DAY_OFF[t.day]);
    if (t.res==='paddock'){
      res.push({date, start:t.s, end:t.e, resource:'Paddock', rawRes:'Paddock', team:t.team, notes:'Training'+(t.notes?' · '+t.notes:''), bad:false, day:t.day, training:true});
    } else {
      train.push({...t, kind:'train', date, surface:t.res, ts:t.s, te:t.e, group:groupFromTeam(t.team), need:t.frac>=0.99?2:1, bw:S.bw.has(iso(date))});
    }
  }
  for (const day of DAYS) for (const surf of ['grass','agp']){
    const list = train.filter(t=>t.day===day && t.surface===surf).sort((a,b)=>a.ts-b.ts || b.need-a.need || a.team.localeCompare(b.team));
    const halves = [[],[]];
    list.forEach(t=>{
      const free = k => !halves[k].some(o=>o.ts<t.te && t.ts<o.te);
      if (t.need>=2){ if (free(0) && free(1)){ t.cols=[0,1]; halves[0].push(t); halves[1].push(t); t.over=false; } else { t.cols=[0]; t.over=true; } }
      else { const k = [0,1].find(free); if (k!==undefined){ t.cols=[k]; halves[k].push(t); t.over=false; } else { t.cols=[0]; t.over=true; } }
    });
    list.forEach(t=>{ t.sharedWith = list.filter(o=>o!==t && o.ts<t.te && t.ts<o.te); });
  }

  $('#wk').textContent = weekRange() + ' · Week ' + weekLetter(S.sat);
  $('#today').hidden = iso(S.sat) === iso(upcomingSaturday());
  $('#status').textContent = (DATA.sample ? (SNAPSHOT_DATE ? 'Sheet copied '+SNAPSHOT_DATE : 'Sample data') : (LAST_OK ? 'Updated '+LAST_OK.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}) : 'Loading…'));
  $('#banners').innerHTML =
    (ERROR?`<div class="banner">${esc(ERROR)}</div>`:'') +
    (DATA.sample && !SNAPSHOT_DATE ? `<div class="banner info">Showing sample data. Set <code>FIXTURES_CSV_URL</code> in CONFIG to read the club sheet live.</div>` : '');
  const rl = $('#reqlink'); rl.hidden = !CONFIG.REQUEST_FORM_URL; if (CONFIG.REQUEST_FORM_URL) rl.href = CONFIG.REQUEST_FORM_URL;
  document.querySelectorAll('#viewSeg button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.v===S.view));
  const days = DAYS.filter(d=>dayHasContent(M,d)||bwOn(d));
  if (days.length && !days.includes(S.day)) S.day = days[0];
  $('#daySeg').style.display = S.view==='day' && days.length ? '' : 'none';
  $('#daySeg').innerHTML = days.map(d=>`<button data-d="${d}" aria-pressed="${d===S.day}">${dayLabel(d)}<small>${daySummary(M,d) || '&nbsp;'}</small></button>`).join('');
  let h = '';
  if (S.view==='message') h = messageView(M);
  else if (!days.length) h = (tv ? '' : attentionBar(M)) + `<div class="card">Nothing scheduled this week.</div>`;
  else {
    const grid = dayGrid(M, S.day), list = dayList(M, S.day);
    h = (tv ? '' : attentionBar(M)) + `<div class="plan">${dayHead(M, S.day)}` +
      (grid || list ? `<div class="card"><div class="gridwrap">${grid}</div><div class="plist">${list}</div>${dayKey(M, S.day)}</div>` : `<div class="card sub">No pitch sessions ${S.q ? 'match your search' : 'on this day'}.</div>`) +
      roomTable(M, S.day) + paddockList(M, S.day) + awayLine(M, S.day) + `</div>`;
  }
  $('#main').innerHTML = h;
}
/* ============================ WEEKEND MESSAGE ============================ */
// One message for the whole manager community. The coordinator can edit it before copying; edits are kept per weekend.
const MSG_KINDS = ['match','away','session','festival','festival-off'];
const GROUP_ORDER = ['MINIS','JUNIOR BOYS','JUNIOR GIRLS','WOMEN','MEN'];
function msgTeamLines(i){
  const opp = (i.act||'').replace(/\s+/g,' ').trim(), slot = slotById(i.slot);
  const isMatch = i.kind==='match' || (i.kind==='away' && !SESSION_RE.test(opp) && !/fest/i.test(opp));
  const extra = i.extra ? ` (${i.extra})` : '';
  const when = `⏰ ${fmtT(slot.s)}–${fmtT(slot.e)}`;
  if (i.paddock) return [`🌱 ${i.team} – Paddock${opp && !SESSION_RE.test(opp) ? ': ' + opp : ''}${extra}`, `   ${when}`];
  if (!i.surface)                                                // away or off-site
    return [`🚌 ${i.team} – away ${isMatch ? 'v ' + (opp || '[opponent TBC]') : opp}${extra}`, `   Meet [time] at [ground]`];
  const head = i.kind==='match' ? `🏉 ${i.team} v ${opp || '[opponent TBC]'}` : `🏉 ${i.team} – ${opp || 'session'}`;
  const t = [when];
  const p = [`🏟 ${posLabel(i)}${i.sharedWith.length ? ' (shared)' : ''}${i.over ? ' – to be confirmed' : ''}`];
  if (i.room !== undefined) p.push(i.room==null ? '🚪 none free – speak to me' : `🚪 Room ${i.room}${i.kind==='match' ? (i.roomAway!=null ? ` (visitors ${i.roomAway})` : ' (visitors: none free)') : ''}`);
  if (!i.noCp && i.cp) p.push('🅿️ car park duty');
  return [`${head}${extra}`, `   ${t.join(' · ')}`, `   ${p.join(' · ')}`];
}
function buildWeekendMessage(M){
  const L = ['Hi all 👋', '', `📅 Weekend ${weekendRange()}`, ''];
  let any = false;
  for (const day of WEEKEND_DAYS){
    const items = M.items.filter(i=>i.day===day && MSG_KINDS.includes(i.kind));
    const rb = M.resBookings.filter(b=>b.day===day && !b.bad).sort((a,b)=>a.start-b.start || a.resource.localeCompare(b.resource));
    const trd = M.train.filter(t=>t.day===day).sort((a,b)=>a.ts-b.ts || a.surface.localeCompare(b.surface));
    if (!items.length && !rb.length && !trd.length) continue;
    any = true;
    L.push(`— ${dayTitle(day).toUpperCase()} —`);
    if (bwOn(day)) L.push('🌧 ' + BW_NOTE);
    const cp = items.filter(i=>i.surface && i.cp).map(i=>i.team);
    if (cp.length) L.push(`🅿️ Car park: ${cp.join(', ')}`);
    L.push('');
    const byTeam = (a,b)=>GROUP_ORDER.indexOf(a.group)-GROUP_ORDER.indexOf(b.group) || seniority(a.team)-seniority(b.team);
    for (const sl of CONFIG.SLOTS){
      const list = items.filter(i=>i.surface && i.slot===sl.id).sort(byTeam);
      list.forEach(i=>{ L.push(...msgTeamLines(i), ''); });
    }
    items.filter(i=>!i.surface).sort(byTeam).forEach(i=>{ L.push(...msgTeamLines(i), ''); });
    if (trd.length){
      L.push('🏃 Training');
      trd.forEach(t=>L.push(`   ${fmtT(t.ts)}–${fmtT(t.te)} ${t.team} · ${t.cols.length>1?SURF[t.surface]+' 1+2':SURF[t.surface]+' '+(t.cols[0]+1)}${t.frac<0.99?' (half)':''}${bwOn(day)&&t.surface==='grass'?' – grass not available, needs to move':''}`));
      L.push('');
    }
    if (rb.length){
      L.push('🥅 Paddock & scrum machines');
      rb.forEach(b=>L.push(`   ${fmtT(b.start)}–${fmtT(b.end)} ${b.resource} · ${b.team||'booked'}${b.notes?' ('+b.notes+')':''}${b.clash?' ⚠️ clash – speak to me':''}`));
      L.push('');
    }
  }
  if (!any) L.push('Nothing scheduled this weekend.', '');
  L.push('Any problems, just reply here. Thanks! 🙏', CONFIG.MESSAGE_SIGNOFF);
  return L.join('\n');
}
S.drafts = {};
const draftKey = () => iso(S.sat);
function weekendText(M){ return S.drafts[draftKey()] ?? buildWeekendMessage(M); }
function messageView(M){
  const edited = S.drafts[draftKey()] !== undefined;
  return `<div class="mintro"><p>Fill in the [gaps], edit if you like, then copy. Edits are kept until you reset.</p>
    <span><button class="btn primary" data-copy="msg">Copy message</button> <button class="btn" data-reset="msg" ${edited?'':'disabled'}>Reset</button></span></div>
    <textarea id="msgText" class="msgbox" spellcheck="false" aria-label="Weekend message">${esc(weekendText(M))}</textarea>`;
}
function flash(btn, text){ const t = btn.dataset.label || (btn.dataset.label = btn.textContent); btn.textContent = text; clearTimeout(btn._t); btn._t = setTimeout(()=>{ btn.textContent = t; }, 2200); }
async function copyWeekend(btn){
  const ta = $('#msgText'), text = ta ? ta.value : weekendText(modelFor(S.sat));
  try { await navigator.clipboard.writeText(text); flash(btn, 'Copied'); }
  catch(e){                                         // clipboard blocked: show the text selected so Ctrl/Cmd+C works
    if (S.view!=='message'){ S.view='message'; S.viewSet=true; render(); }
    const box = $('#msgText'); box.focus(); box.select(); flash(btn, 'Selected: press Ctrl/Cmd+C');
  }
}
$('#main').addEventListener('click', e => {
  if (e.target.closest('[data-attn]')){ S.attnOpen = !S.attnOpen; render(); return; }
  const c = e.target.closest('[data-copy]'); if (c) copyWeekend(c);
  const r = e.target.closest('[data-reset]'); if (r && !r.disabled){ delete S.drafts[draftKey()]; render(); }
});
$('#main').addEventListener('click', e => {
  const b = e.target.closest('[data-bw]');
  if (b){ const d = iso(addDays(S.sat, DAY_OFF[b.dataset.bw])); S.bw.has(d) ? S.bw.delete(d) : S.bw.add(d); writeHash(); render(); return; }
  const l = e.target.closest('[data-bwlink]');
  if (l){ writeHash(); const url = location.href; (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(()=>flash(l,'Link copied')).catch(()=>flash(l,'Copy the address bar link')); }
});
$('#main').addEventListener('input', e => {
  if (e.target.id==='msgText'){ S.drafts[draftKey()] = e.target.value; const r = document.querySelector('[data-reset]'); if (r) r.disabled = false; }
});

/* ============================ EVENTS ============================ */
$('#viewSeg').onclick = e => { const v=e.target.dataset.v; if(v){ S.view=v; S.viewSet=true; render(); } };
$('#daySeg').onclick = e => { const d=e.target.dataset.d; if(d){ S.day=d; S.dayPicked=true; render(); } };
const shift = n => { S.sat=addDays(S.sat,n); S.dayPicked=false; autoDay(); render(); };
$('#prev').onclick = () => shift(-7);
$('#next').onclick = () => shift(7);
$('#today').onclick = () => { S.sat=upcomingSaturday(); S.dayPicked=false; autoDay(); render(); };
$('#q').oninput = e => { S.q=e.target.value; render(); $('#q').focus(); };
addEventListener('hashchange', () => { readHash(); render(); });

readHash(); load();
setInterval(load, CONFIG.REFRESH_MINUTES*60000);
setInterval(() => {                       // TV mode: cycle through weekend days that have pitch use
  if (!document.body.classList.contains('tv')) return;
  const M = modelFor(S.sat), days = DAYS.filter(d=>dayHasContent(M,d));
  if (!days.length) return;
  S.view='day'; S.day = days[(days.indexOf(S.day)+1)%days.length]; render();
}, CONFIG.TV_CYCLE_SECONDS*1000);
</script>
</body>
