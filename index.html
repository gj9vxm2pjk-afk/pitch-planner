<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pitch Planner</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap">
<style>
:root{
  /* Whitley Bay Rockcliff RFC: cardinal red, club gold, cream */
  --bg:#f7f0e0; --surface:#ffffff; --text:#1f1416; --muted:#6b5a5c; --line:#e3d6c0;
  --brand:#c41e3a; --brand-ink:#ffffff; --gold:#f2b705;
  --accent:#c41e3a; --accent-ink:#ffffff; --danger:#a8141f; --warn:#8a6200; --share:#2a5fa8;
  --hour:60px;
  --display:'Oswald','Arial Narrow','Helvetica Neue',Impact,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1a0f11; --surface:#26171a; --text:#f4ece0; --muted:#bba8aa; --line:#3d2a2d;
    --brand:#8e1428; --brand-ink:#ffffff; --gold:#f2b705;
    --accent:#d63a52; --accent-ink:#ffffff; --danger:#ff7a86; --warn:#f2b705; --share:#7fb0f0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1a0f11; --surface:#26171a; --text:#f4ece0; --muted:#bba8aa; --line:#3d2a2d;
  --brand:#8e1428; --brand-ink:#ffffff; --gold:#f2b705;
  --accent:#d63a52; --accent-ink:#ffffff; --danger:#ff7a86; --warn:#f2b705; --share:#7fb0f0;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header.brand{padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;background:var(--brand);color:var(--brand-ink);border-bottom:4px solid var(--gold)}
header.brand .crest{height:46px;width:auto;flex:none;background:#fff;border-radius:8px;padding:3px}
header.brand .names{flex:1 1 12rem;min-width:0}
.club{font:600 .78rem/1.1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
h1{font:600 1.45rem/1.15 var(--display);letter-spacing:.03em;text-transform:uppercase;margin:0}
header.brand .status{color:var(--brand-ink);opacity:.85}
.status{font-size:.8rem;color:var(--muted)}
.banner{margin:8px 16px;padding:8px 12px;border-radius:8px;font-size:.88rem;background:color-mix(in srgb,var(--danger) 14%,var(--surface));border:1px solid var(--danger)}
.banner.info{background:color-mix(in srgb,var(--warn) 14%,var(--surface));border-color:var(--warn)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
button,select,input{font:inherit;color:inherit}
.seg button{border:0;background:none;padding:7px 12px;cursor:pointer;min-height:36px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;min-height:36px}
.wk{font-weight:600;min-width:11ch;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:3px 10px;font-size:.82rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip.static{cursor:default}
.chip.bad{border-color:var(--danger);color:var(--danger)}
.chip.share{border-color:var(--share);color:var(--share)}
main{padding:0 16px 32px}
.dayhead{font:600 1.05rem/1.2 var(--display);letter-spacing:.04em;text-transform:uppercase;margin:12px 0 6px}
.strip{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.85rem;color:var(--muted);margin:0 0 8px}
.strip b{color:var(--text)}
.dayhead.sub{font-size:.95rem;margin-top:16px}
.blk.tail{background:transparent;border:1px dashed var(--line);color:var(--muted);padding:0}
.bad-text{color:var(--danger)}
.dh{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}
.bwbar{display:flex;flex-wrap:wrap;gap:6px;font:500 .85rem system-ui,sans-serif;text-transform:none;letter-spacing:0}
.bwbtn[aria-pressed="true"]{background:var(--danger);color:var(--surface);border-color:var(--danger)}
.banner.inmain{margin:8px 0}
#daySeg{flex-wrap:wrap} #daySeg button{padding:7px 10px}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin:0 0 10px;overflow:hidden}
.mcard header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line)}
.mcard h3{margin:0;font-size:.95rem}
pre.msg{margin:0;padding:10px 12px;white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.mintro{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:12px 0}
.mintro p{margin:0;font-size:.88rem;color:var(--muted);flex:1 1 20rem}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
details.allmsg{margin:12px 0}
.msgbox{display:block;width:100%;min-height:55vh;resize:vertical;margin:0;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text);font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
details.allmsg summary{cursor:pointer;color:var(--muted);font-size:.88rem}
.gridwrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface);max-height:78vh}
.grid{display:grid;position:relative;min-width:max-content}
.corner,.colhead{position:sticky;top:0;z-index:4;background:var(--surface);border-bottom:1px solid var(--line);padding:8px 6px;font-weight:600;font-size:.85rem;text-align:center}
.colhead small{display:block;font-weight:400;color:var(--muted)}
.colhead .halves{display:flex;margin:4px -6px -8px;border-top:1px solid var(--line)}
.colhead .halves span{flex:1;padding:2px 0}
.colhead .halves span+span{border-left:1px solid var(--line)}
.col.halved{background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,transparent calc(50% - .5px),var(--line) calc(50% - .5px),var(--line) calc(50% + .5px),transparent calc(50% + .5px));background-size:100% var(--hour),100% 100%}
.corner{left:0;z-index:5}
.times{position:sticky;left:0;z-index:3;background:var(--surface);border-right:1px solid var(--line)}
.times div{height:var(--hour);font-size:.74rem;color:var(--muted);padding:2px 6px;border-top:1px solid var(--line)}
.col{position:relative;border-left:1px solid var(--line);
  background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% var(--hour)}
.blk{position:absolute;border-radius:6px;padding:3px 5px;font-size:.76rem;line-height:1.25;overflow:hidden;
  color:#101410;border:1px solid rgba(0,0,0,.25)}
.blk b{display:block;overflow-wrap:anywhere}
.blk .sub{opacity:.85;overflow-wrap:anywhere}
.blk.shared{border-style:dashed;border-width:2px;border-color:var(--share)}
.blk.over{outline:3px solid var(--danger);outline-offset:-1px;background-image:repeating-linear-gradient(45deg,rgba(192,38,45,.2) 0 6px,transparent 6px 12px)}
.tag{display:inline-block;font-weight:700;font-size:.68rem;border-radius:4px;padding:0 4px;margin-right:3px;background:rgba(255,255,255,.7);color:#10161a}
.tag.sh{color:#1b4a8c} .tag.ov{color:#a01b22}
.agenda .card{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin:0 0 10px;overflow:hidden}
.agenda .card h3{margin:0;padding:8px 12px;font:600 1rem/1.2 var(--display);letter-spacing:.04em;text-transform:uppercase;border-bottom:1px solid var(--line)}
.agenda h4{margin:0;padding:6px 12px;font-size:.78rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);background:color-mix(in srgb,var(--muted) 8%,var(--surface))}
.row{display:grid;grid-template-columns:minmax(0,9.5rem) minmax(0,1fr);gap:8px;padding:8px 12px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row.dim{color:var(--muted)}
.row .t{color:var(--muted);font-size:.9rem}
.pill{display:inline-block;border-radius:99px;padding:0 8px;font-size:.74rem;margin-left:6px;border:1px solid currentColor;white-space:nowrap}
.pill.bad{color:var(--danger)} .pill.warn{color:var(--warn)} .pill.sh{color:var(--share)} .pill.cp{color:var(--accent)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:12px 0}
.panel h2{font-size:.95rem;margin:0 0 6px}
.panel ul{margin:0;padding-left:18px}
.panel p{margin:8px 0 0;font-size:.82rem;color:var(--muted)}
.ok{color:var(--accent)}
input[type=search]{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;min-height:36px;width:180px;max-width:100%}
body.tv{font-size:20px;--hour:84px}
body.tv header.brand .crest{height:64px}
body.tv .bar>*{display:none}
body.tv .bar #copyBar{display:none}
@media (max-width:700px){ .wk{min-width:9ch} .row{grid-template-columns:1fr} }
</style>
</head>

<script>
/* ============================ CONFIG ============================
 * To connect the club sheet ("WBR Age Grade Fixtures 26/27"):
 *  1. Google Sheets: File > Share > Publish to web. Pick the "Combined Fixture list" tab,
 *     choose "Comma-separated values (.csv)", Publish. Copy the link into FIXTURES_CSV_URL.
 *     Repeat for the "Config and info" tab (optional) into CONFIG_CSV_URL.
 *     (Anyone with a published link can read that tab.)
 *  2. Leave FIXTURES_CSV_URL as '' to show the built-in snapshot.
 *
 * Sheet layout this page understands: row 1 = group, row 2 = team, column A = date (DD/MM).
 * Each team has: [opponent/activity] [HG home grass | HA home AGP | AW away] [CP car-park duty].
 */
const CONFIG = {
  FIXTURES_CSV_URL: '',
  CONFIG_CSV_URL: '',
  REFRESH_MINUTES: 5,
  TV_CYCLE_SECONDS: 15,
  SEASON_START: '2026-08-02',               // used to give DD/MM dates a year (overridden by the Config tab)
  // Each surface is one full pitch shown as two halves (Grass 1 + Grass 2, AGP 1 + AGP 2).
  // A full-pitch team takes both halves; smaller teams share them.
  CAPACITY: { grass: 1, agp: 1 },            // full pitches per surface
  // Changing rooms: in each time slot the home teams are ranked by seniority (age group). The most senior
  // teams get rooms 1 and 3, the least senior get rooms 2 and 4. Teams arrive ready to play and change after
  // the match; a room is booked from match end for ROOM_CHANGE_MIN, then needs ROOM_TURNAROUND_MIN.
  ROOMS: { senior: [1, 3], junior: [2, 4] },
  // Bookable extras (booked in the separate "WBR Paddock & Scrum Machine Bookings" sheet: Date, Start, End, Resource, Team, Notes)

function addDays(d, n){ const x = new Date(d); x.setDate(x.getDate()+n); return x; }
function upcomingSaturday(){
  const t = new Date(); t.setHours(0,0,0,0); const dow = t.getDay();
  return dow === 6 ? t : dow === 0 ? addDays(t,-1) : addDays(t, 6-dow);
}
function parseCSV(text){
  const rows=[]; let row=[], f='', q=false;
  for (let i=0;i<text.length;i++){
    const c=text[i];
    if (q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if (c==='"') q=true;
    else if (c===','){ row.push(f); f=''; }
    else if (c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(f); f=''; rows.push(row); row=[]; }
    else f+=c;
  }
  if (f!==''||row.length){ row.push(f); rows.push(row); }
  return rows;
}
function dayKeyFor(date, sat){
  const diff = Math.round((date - sat)/86400000);

}

const SESSION_RE = /^\??\s*(pre-?season|training|indoors|joint training)/i;
function parseGrid(rows){
  const isDate = v => /^\s*\d{1,2}\/\d{1,2}\s*$/.test(v||'');
  const first = rows.findIndex(r => isDate(r[0]));
  if (first < 2) throw new Error('could not find the team headers or dates');
  const gRow = rows[first-2], tRow = rows[first-1];
  const width = Math.max(...rows.map(r=>r.length));
  const blocks=[]; let group='', lastT='';
  for (let c=1;c<width;c++){
    const g=(gRow[c]||'').trim(), t=(tRow[c]||'').trim();
    if (g) group=g;
    if (t && t!==lastT){ blocks.push({team:cleanTeam(t), group:groupKey(group), cols:[c]}); lastT=t; }
    else if (blocks.length) blocks[blocks.length-1].cols.push(c);
  }
  const season = new Date(CONFIG.SEASON_START+'T00:00:00');
  const items=[];
  for (const row of rows.slice(first)){
    if (!isDate(row[0])) continue;
    const [d,m] = row[0].trim().split('/').map(Number);
    const date = new Date(season.getFullYear() + (m-1 < season.getMonth() ? 1 : 0), m-1, d);
    for (const b of blocks){
      const act = (row[b.cols[0]]||'').trim();
      const vr = b.cols[1]!=null ? (row[b.cols[1]]||'').trim().toUpperCase() : '';
      const venue = ['HG','HA','AW'].includes(vr) ? vr : '';
      const badVenue = vr && !venue ? vr : '';
      const cp = b.cols[2]!=null && /^cp$/i.test((row[b.cols[2]]||'').trim());
      const extra = b.cols.slice(3).map(c=>(row[c]||'').trim()).filter(v=>v && !/^HG\s*=/i.test(v)).join(' · ');
      if (!act && !venue) continue;
      let kind;
      if (venue==='AW') kind='away';
      else if (venue) kind = SESSION_RE.test(act) ? 'session' : /fest/i.test(act) ? 'festival' : 'match';
      else kind = SESSION_RE.test(act) ? 'training' : /fest/i.test(act) ? 'festival-off' : 'other';
      items.push({date, team:b.team, group:b.group, act, venue, badVenue, cp, extra, kind,
        surface: venue==='HG'?'grass':venue==='HA'?'agp':'',
        unconfirmed: /\?/.test(act),
        mismatch: (venue && venue!=='AW' && /\(A\)|\baway\b/i.test(act)) || (venue==='AW' && /\(H\)|\(home|\bhome\b/i.test(act))});
    }
  }
  return items;
}
function weekLetter(sat){
  const a = new Date(CONFIG.WEEK_A_START+'T00:00:00'), n = Math.round((addDays(sat,-5) - a)/(7*86400000));
  return ((n%2)+2)%2===0 ? 'A' : 'B';
}
function groupFromTeam(team){
  if (/1st XV|2nd XV|women/i.test(team)) return 'WOMEN';
  if (/girls/i.test(team)) return 'JUNIOR GIRLS';
  const m = team.match(/U\s?(\d+)/i);
  if (m && +m[1] <= 12) return 'MINIS';
  return 'JUNIOR BOYS';
}

  if (/^half/.test(t)) return 0.5;
  if (/^third/.test(t)) return 1/3;
  if (/^quarter/.test(t)) return 0.25;
  let m = t.match(/^(\d+)\s*\/\s*(\d+)$/); if (m) return +m[1]/+m[2];
  m = t.match(/^(\d+(?:\.\d+)?)\s*%$/); if (m) return +m[1]/100;
  return null;
}
function parseTraining(rows){
  if (!rows.length) return [];

  const c = {day:ix('day'), team:ix('team'), start:ix('start'), end:ix('end'), res:ix('resource'), share:ix('share'), weeks:ix('weeks'), notes:ix('notes')};
  if (c.day<0 || c.team<0 || c.start<0 || c.end<0 || c.res<0) throw new Error('training sheet needs Day, Team, Start, End and Resource columns');
  const DK = {mon:'mon',tue:'tue',tues:'tue',wed:'wed',thu:'thu',thur:'thu',thurs:'thu',fri:'fri',sat:'sat',sun:'sun'};
  const out = [];
  for (const r of rows.slice(1)){

    const day = DK[(r[c.day]||'').trim().toLowerCase().slice(0,5).replace(/\.$/,'')] || DK[(r[c.day]||'').trim().toLowerCase().slice(0,3)];
    const rr = (r[c.res]||'').trim().toLowerCase(), res = /grass/.test(rr) ? 'grass' : /agp|astro|all.?weather/.test(rr) ? 'agp' : /paddock/.test(rr) ? 'paddock' : '';

    const w = ((c.weeks>=0 ? r[c.weeks] : '')||'').trim().toUpperCase(), weeks = /\bA\b|^A$|WEEK A/.test(w) ? 'A' : /\bB\b|^B$|WEEK B/.test(w) ? 'B' : 'ALL';

}
function parseBookings(rows){

  if (c.date<0 || c.start<0 || c.end<0 || c.res<0) throw new Error('bookings sheet needs Date, Start, End and Resource columns');

function parseSheetDate(v){
  v = String(v||'').trim(); let m;
  if ((m = v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return new Date(+m[1], m[2]-1, +m[3]);
  if ((m = v.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/))) return new Date(m[3].length===2 ? 2000+ +m[3] : +m[3], m[2]-1, +m[1]);

}

  if (!m) return null; let h = +m[1]; const mi = +(m[2]||0);

/* ============================ MODEL ============================ */
// How senior a team is: bigger = more senior (Women's 1st XV, 2nd XV, then by age group; Colts count as 17)
function seniority(team){
  if (/1st XV/i.test(team)) return 200;
  if (/2nd XV/i.test(team)) return 199;
  if (/colts/i.test(team)) return 17;
  const m = team.match(/U\s?(\d+)/i);
  return m ? +m[1] : 0;
}
function buildRooms(items){
  const C = CONFIG, reqs = [], clashes = [];
  const order = [...C.ROOMS.senior, ...C.ROOMS.junior];          // most senior team picks first: 1, 3, then 2, 4
  const need = items.filter(i=>i.surface && C.ROOM_GROUPS.includes(i.group) && C.ROOM_KINDS.includes(i.kind));
  for (const day of DAYS){
    const list = need.filter(i=>i.day===day).sort((a,b)=>slotById(a.slot).e-slotById(b.slot).e || seniority(b.team)-seniority(a.team) || a.team.localeCompare(b.team));
    const busy = {};                                         // room number -> time it is free again
    for (const i of list){
      const start = slotById(i.slot).e, end = start + C.ROOM_CHANGE_MIN, block = end + C.ROOM_TURNAROUND_MIN;
      const room = order.find(r => (busy[r] ?? -1) <= start);
      const req = {item:i, day, start, end, block, room: room ?? null, label:i.team};
      if (room != null) busy[room] = block;
      else { req.freeAt = Math.min(...order.map(r=>busy[r])); i.roomClash = true; clashes.push(req); }
      i.room = room ?? null;
      reqs.push(req);
    }
  }
  return {reqs, clashes};
}
function modelFor(sat){
  const items = [];
  for (const it of DATA.items){
    const day = dayKeyFor(it.date, sat); if (!day) continue;
    items.push({...it, day, slot: slotIdFor(it), frac: shareOf(it.team)});
  }
  // allocate home teams within each surface + slot: full pitch = both halves, smaller teams share the halves
  const groups = {};
  items.filter(i=>i.surface).forEach(i => (groups[i.day+'|'+i.surface+'|'+i.slot] ||= []).push(i));
  const shared = [];
  for (const k in groups){
    const list = groups[k].slice();
    const surface = list[0].surface, limit = CONFIG.CAPACITY[surface] + CONFIG.OVERRUN + 1e-6, multi = list.length > 1;
    // a full-size team alone takes the whole pitch; with anyone else it takes one half
    list.forEach(i => { i.eff = (i.frac >= 0.99 && multi) ? 0.5 : i.frac; });
    list.sort((a,b)=>b.eff-a.eff);
    const load = [0,0], total = list.reduce((t,o)=>t+o.eff,0), tooMany = total > limit;
    list.forEach(i=>{
      i.groupTotal = total; i.over = tooMany;
      if (i.eff >= 0.99){ i.cols = [0,1]; load[0]+=1; load[1]+=1; }
      else { const c = load[0] <= load[1] ? 0 : 1; i.cols = [c]; load[c] += i.eff; }
      i.sharedWith = list.filter(o=>o!==i);
    });
    if (multi) shared.push({day:list[0].day, surface, slot:list[0].slot, items:list, total, over:tooMany});
  }
  const rooms = buildRooms(items);
  // paddock & scrum machine bookings for this weekend, with overlap checks per resource
  const res = [];
  for (const b of (DATA.bookings||[])){
    if (!b.date) continue;
    const day = dayKeyFor(b.date, sat); if (!day) continue;
    res.push({...b, day});
  }
  // weekly training: pitch sessions are placed on the halves of each surface; paddock sessions join the paddock bookings
  const wk = weekLetter(sat), train = [], badTrain = [];
  for (const t of (DATA.training||[])){
    if (t.bad){ badTrain.push(t); continue; }
    if (t.weeks!=='ALL' && t.weeks!==wk) continue;
    const date = addDays(sat, DAY_OFF[t.day]);
    if (t.res==='paddock'){
      res.push({date, start:t.s, end:t.e, resource:'Paddock', rawRes:'Paddock', team:t.team, notes:'Training'+(t.notes?' · '+t.notes:''), bad:false, day:t.day, training:true});
    } else {
      train.push({...t, kind:'train', date, surface:t.res, ts:t.s, te:t.e, group:groupFromTeam(t.team), need:t.frac>=0.99?2:1, bw:S.bw.has(iso(date))});
    }
  }
  for (const day of DAYS) for (const surf of ['grass','agp']){
    const list = train.filter(t=>t.day===day && t.surface===surf).sort((a,b)=>a.ts-b.ts || b.need-a.need || a.team.localeCompare(b.team));
    const halves = [[],[]];
    list.forEach(t=>{
      const free = k => !halves[k].some(o=>o.ts<t.te && t.ts<o.te);
      if (t.need>=2){ if (free(0) && free(1)){ t.cols=[0,1]; halves[0].push(t); halves[1].push(t); t.over=false; } else { t.cols=[0]; t.over=true; } }
      else { const k = [0,1].find(free); if (k!==undefined){ t.cols=[k]; halves[k].push(t); t.over=false; } else { t.cols=[0]; t.over=true; } }
    });
    list.forEach(t=>{ t.sharedWith = list.filter(o=>o!==t && o.ts<t.te && t.ts<o.te); });
  }
  const valid = res.filter(b=>!b.bad);
  valid.forEach(a=>{ a.clash = valid.some(o=>o!==a && o.day===a.day && o.resource===a.resource && o.start < a.end && a.start < o.end); });
  return {
    train, badTrain, trainOver: train.filter(t=>t.over), weekLetter: wk,
    resBookings: res, resClashes: valid.filter(b=>b.clash), badBookings: res.filter(b=>b.bad),
    items, shared, roomReqs: rooms.reqs, roomClashes: rooms.clashes,
    over: items.filter(i=>i.over),
    unconfirmed: items.filter(i=>i.unconfirmed),
    mismatch: items.filter(i=>i.mismatch),
    badVenue: items.filter(i=>i.badVenue),
    cp: d => items.filter(i=>i.day===d && i.cp)
  };
}

const S = { view:'day', day:'sun', sat:upcomingSaturday(), surf:new Set(), grp:new Set(), bw:new Set(), q:'', viewSet:false, dayPicked:false };

  const nums = [...CONFIG.ROOMS.senior.map(n=>({n,side:'senior'})), ...CONFIG.ROOMS.junior.map(n=>({n,side:'junior'}))].sort((a,b)=>a.n-b.n);
  const clash = reqs.filter(r=>r.room==null);
  const cols = nums.map(c=>({...c, list:reqs.filter(r=>r.room===c.n)}));
  if (clash.length) cols.push({n:0, side:'none', list:clash});
  const blk = (r, c) => {
    const top = (r.start-t0)/60*hpx+1, h1 = (r.end-r.start)/60*hpx-2, h2 = (r.block-r.end)/60*hpx;
    const bad = c.side==='none';
    return `<div class="blk ${bad?'over':''}" style="top:${top}px;height:${Math.max(h1,20)}px;left:2px;width:calc(100% - 4px);background:${colourFor(r.item.group)}"
        title="${esc(r.label)} · change ${fmtT(r.start)}–${fmtT(r.end)}${bad?' · no room free':''}"><b>${bad?'<span class="tag ov">NO ROOM</span>':''}${esc(r.label)}</b><span class="sub">${fmtT(r.start)}–${fmtT(r.end)}</span></div>` +
      `<div class="blk tail" style="top:${top+Math.max(h1,20)+2}px;height:${Math.max(h2-2,6)}px;left:2px;width:calc(100% - 4px)" title="Turnaround until ${fmtT(r.block)}"></div>`;
  };
  let h = `<div class="grid" style="grid-template-columns:52px ${cols.map(()=>'minmax(120px,1fr)').join(' ')}">`;
  h += `<div class="corner">Time</div>` + cols.map(c=>`<div class="colhead ${c.side==='none'?'over':''}">${c.side==='none'?'No room free':'Room '+c.n}<small>${c.side==='none'?'Needs a room':'&nbsp;'}</small></div>`).join('');
  h += `<div class="times">` + Array.from({length:hours},(_,i)=>`<div>${fmtT(t0+i*60)}</div>`).join('') + `</div>`;
  for (const c of cols) h += `<div class="col" style="height:${hours*hpx}px">${c.list.map(r=>blk(r,c)).join('')}</div>`;
  h += `</div>`;
  return `<div class="dayhead sub">Changing rooms</div><div class="gridwrap">${h}</div>`;
}
function dayStrip(M, day){

  return `<div class="strip">${home.length?`<span><b>${home.length}</b> home sessions</span>`:''}${nt?`<span><b>${nt}</b> training session${nt===1?'':'s'}</span>`:''}${sh.length?`<span><b>${sh.length}</b> shared pitch${sh.length===1?'':'es'}</span>`:''}` +
    (cp.length?`<span>Car park marshals: <b>${cp.map(i=>esc(i.team)).join(', ')}</b></span>`:'') + `</div>`;
}

  if (rc) h += `<h2>Changing room clashes (${M.roomClashes.length})</h2><ul>${rc}</ul>`;
  if (ov) h += `<h2>Over capacity (${M.over.length})</h2><ul>${ov}</ul>`;
  if (sh) h += `<h2 style="margin-top:10px">Shared pitches (${M.shared.length})</h2><ul>${sh}</ul>`;
  if (mm || bv) h += `<h2 style="margin-top:10px">Check the sheet (${M.mismatch.length+M.badVenue.length})</h2><ul>${mm}${bv}</ul>`;
  if (un) h += `<h2 style="margin-top:10px">Unconfirmed (${M.unconfirmed.length})</h2><ul>${un}</ul>`;
  if (!h) h = `<span class="ok">No shared pitches, capacity or changing-room problems, or unconfirmed games this weekend.</span>`;
  return `<div class="panel">${h}<p>Time slots and pitch positions are worked out from the age group and pitch size; the sheet doesn't hold kick-off times. Each surface is one full pitch in two halves. A full-size team on its own takes both halves; with another team it takes one half.</p></div>`;
}

/* ============================ WEEKEND MESSAGE ============================ */
// One message for the whole manager community. The coordinator can edit it before copying; edits are kept per weekend.
const MSG_KINDS = ['match','away','session','festival','festival-off'];
const GROUP_ORDER = ['MINIS','JUNIOR BOYS','JUNIOR GIRLS','WOMEN'];
function msgTeamLines(i){
  const opp = (i.act||'').replace(/\s+/g,' ').trim(), slot = slotById(i.slot);
  const isMatch = i.kind==='match' || (i.kind==='away' && !SESSION_RE.test(opp) && !/fest/i.test(opp));
  const extra = i.extra ? ` (${i.extra})` : '';
  if (!i.surface){                                              // away or off-site
    const what = isMatch ? `${i.team} – AWAY v ${opp || '[opponent TBC]'}` : `${i.team} – AWAY: ${opp}`;
    return [`${what}${extra}`, `   Meet at [time] at [ground] | Kick-off [time]${isMatch ? ' | Referee [TBC]' : ''}`];
  }
  const head = i.kind==='match' ? `${i.team} – HOME v ${opp || '[opponent TBC]'}` : i.kind==='session' ? `${i.team} – SESSION: ${opp}` : `${i.team} – EVENT: ${opp}`;
  const t = [`Slot ${fmtT(slot.s)}–${fmtT(slot.e)}`, `Kick-off [time]`];
  if (isMatch) t.push('Referee [TBC]');
  const p = [`Pitch: ${posLabel(i)} (${sizeLabel(i)})${i.sharedWith.length ? ', shared with ' + i.sharedWith.map(o=>o.team).join(', ') : ''}`];
  if (i.over) p.push('pitch to be confirmed');
  if (i.room !== undefined) p.push(i.room==null ? 'Changing room: none free, please speak to me' : `Changing room: Room ${i.room} (from about ${fmtT(slot.e)})`);
  p.push(i.cp ? 'Car park: your team is marshalling' : 'Car park: not on duty');
  return [`${head}${extra}`, `   ${t.join(' | ')}`, `   ${p.join(' | ')}`];
}
function buildWeekendMessage(M){
  const L = ['Hi all,', '', `Weekend logistics – ${weekendRange()}`, ''];
  let any = false;
  for (const day of WEEKEND_DAYS){
    const items = M.items.filter(i=>i.day===day && MSG_KINDS.includes(i.kind));
    const rb = M.resBookings.filter(b=>b.day===day && !b.bad).sort((a,b)=>a.start-b.start || a.resource.localeCompare(b.resource));
    const trd = M.train.filter(t=>t.day===day).sort((a,b)=>a.ts-b.ts || a.surface.localeCompare(b.surface));
    if (!items.length && !rb.length && !trd.length) continue;
    any = true;
    L.push(dayTitle(day).toUpperCase());
    if (bwOn(day)) L.push(BW_NOTE);
    const cp = items.filter(i=>i.surface && i.cp).map(i=>i.team);
    if (cp.length) L.push(`Car park marshals: ${cp.join(', ')}`);
    L.push('');
    const byTeam = (a,b)=>GROUP_ORDER.indexOf(a.group)-GROUP_ORDER.indexOf(b.group) || seniority(a.team)-seniority(b.team);
    for (const sl of CONFIG.SLOTS){
      const list = items.filter(i=>i.surface && i.slot===sl.id).sort(byTeam);
      list.forEach(i=>{ L.push(...msgTeamLines(i), ''); });
    }
    items.filter(i=>!i.surface).sort(byTeam).forEach(i=>{ L.push(...msgTeamLines(i), ''); });
    if (trd.length){
      L.push('Training');
      trd.forEach(t=>L.push(`   ${fmtT(t.ts)}–${fmtT(t.te)} ${t.team}: ${t.cols.length>1?SURF[t.surface]+' 1 + 2':SURF[t.surface]+' '+(t.cols[0]+1)}${t.frac<0.99?' (half pitch)':''}${bwOn(day)&&t.surface==='grass'?' – grass not available, needs to move':''}`));
      L.push('');
    }
    if (rb.length){
      L.push('Paddock & scrum machines');
      rb.forEach(b=>L.push(`   ${b.resource}: ${fmtT(b.start)}–${fmtT(b.end)} ${b.team||'booked'}${b.notes?' ('+b.notes+')':''}${b.clash?' – CLASH, please speak to me':''}`));
      L.push('');
    }
  }
  if (!any) L.push('Nothing scheduled this weekend.', '');
  L.push('Please arrive ready to play and get changed after the match.', 'Any problems, just reply to this message.', 'Thanks,', CONFIG.MESSAGE_SIGNOFF);
  return L.join('\n');
}

function flash(btn, text){ const t = btn.dataset.label || (btn.dataset.label = btn.textContent); btn.textContent = text; clearTimeout(btn._t); btn._t = setTimeout(()=>{ btn.textContent = t; }, 2200); }

  }
}

$('#next').onclick = () => shift(7);
$('#today').onclick = () => { S.sat=upcomingSaturday(); S.dayPicked=false; autoDay(); render(); };
$('#q').oninput = e => { S.q=e.target.value; render(); $('#q').focus(); };
$('#chips').onclick = e => {
  const s=e.target.dataset.s, g=e.target.dataset.g, set = s?S.surf:S.grp, k=s||g; if(!k) return;
  set.has(k)?set.delete(k):set.add(k); render();
};
addEventListener('hashchange', () => { readHash(); render(); });

readHash(); load();
setInterval(load, CONFIG.REFRESH_MINUTES*60000);
setInterval(() => {                       // TV mode: cycle through weekend days that have pitch use
  if (!document.body.classList.contains('tv')) return;
  const M = modelFor(S.sat), days = DAYS.filter(d=>dayHasContent(M,d));
  if (!days.length) return;
  S.view='day'; S.day = days[(days.indexOf(S.day)+1)%days.length]; render();
}, CONFIG.TV_CYCLE_SECONDS*1000);
</script>
</body>
</html>
